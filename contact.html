	<!-- Main Content Container -->
	<main>
		<section>
  			<h1>Contact Me</h1>
			<img src="assets/images/profile.jpg" alt="Portrait of Cahmetri Pryce" class="portrait-image">
			<div class="social-image"></div>
			<div class="social-icons">
				<a href="mailto:cahmetripryce@gmail.com" title="Email">
					<img src="assets/images/gmail-icon.png" alt="Gmail">
				</a>
				<a href="https://www.indeed.com" target="_blank" title="Indeed">
					<img src="assets/images/indeed-logo.png" alt="Indeed">
				</a>
				<a href="https://www.instagram.com/marvellous_metri?gwpx=dWEweWQ3azVubGs2" title="Instagram">
					<img src="assets/images/Instagram-icon.png" alt="Instagram">
				</a>
			</div>
			<p>Feel free to contact me using the for below or through my social media above.</p>
  			<form action="#" method="post">

    			<div>
      				<label for="first-name">First Name:</label>
      				<input type="text" id="first-name" name="first_name" required>
    			</div>

				<div>
					<label for="last-name">Last Name</label>
					<input type="text" id="last-name" name="last_name" required>
				</div>

    			<div>
      				<label for="email">Email Address:</label>
      				<input type="email" id="email" name="email" required>
    			</div>

    			<div>
      				<label for="phone">Phone Number:</label>
      				<input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890" required>
    			</div>

    			<div>
      				<label for="message">Message:</label>
      				<textarea id="message" name="message" rows="5" required></textarea>
    			</div>

    			<button type="submit">Send Message</button>
  			</form>
		</section>
	</main>
